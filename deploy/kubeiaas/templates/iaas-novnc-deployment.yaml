{{- if .Values.iaasNovnc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iaas-novnc
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.iaasNovnc.replicas }}
  selector:
    matchLabels:
      app: iaas-novnc
  template:
    metadata:
      labels:
        app: iaas-novnc
    spec:
      containers:
        - name: iaas-novnc
          command: ["sh"]
          args:
            - "-c"
            - "python3 /usr/local/vnc/websockify-0.10.0/websockify --web=/usr/local/vnc/noVNC-1.3.0/ 8787 --target-config=/usr/local/vnc/token/token.conf"
          image: {{ .Values.iaasNovnc.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.iaasNovnc.service.port }}
          volumeMounts:
            - name: novnc-token
              mountPath: /usr/local/vnc/token
      volumes:
        - name: novnc-token
          nfs:
            path: {{ .Values.nfs.paths.vncToken }}
            server: {{ .Values.nfs.server }}
{{- end }}
